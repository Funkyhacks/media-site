# SecWeb — docker-compose (SPEC.md §3, IMMUTABLE directive #5 honoured).
# Services:
#   api     FastAPI backend (uvicorn, 2 workers)
#   db      SQLite on a named volume (the "db" service per spec)
#   cache   Redis with appendonly no + save "" (ephemeral, no disk writes)
#   web     React (Vite) static frontend (built multi-stage)

networks:
  app-network:
    driver: bridge

name: secweb

services:
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    image: secweb/api:latest
    ports:
      - "8000:8000"
    environment:
      SECWEB_JWT_SECRET: ${SECWEB_JWT_SECRET:?must set SECWEB_JWT_SECRET}
      SECWEB_JWT_TTL_SECONDS: ${SECWEB_JWT_TTL_SECONDS:-3600}
      SECWEB_STORAGE_DIR: /app/storage
      SECWEB_DB_PATH: /app/db/secweb.db
      SECWEB_REDIS_URL: redis://cache:6379/0
      SECWEB_DEFAULT_TTL_SECONDS: ${SECWEB_DEFAULT_TTL_SECONDS:-300}
    volumes:
      - dbdata:/app/db
      - storage:/app/storage
    networks:
      - app-network
    depends_on:
      # Start only AFTER the db service reports healthy (volume seeded + owned
      # by UID 1000), so the API's first write never hits a root-owned file.
      db:
        condition: service_healthy
      cache:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=4).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: "2.0"

  db:
    image: alpine:3.20
    # The API runs as the non-root `secweb` user (UID 1000 in python:3.12-slim,
    # see docker/Dockerfile.backend). This service seeds and OWNS the `dbdata`
    # volume as that same UID so the API can write secweb.db and its SQLite
    # journal/WAL sidecars. If this runs as root (alpine default), the DB file
    # is root-owned 0644 and the API's first write fails with
    # "attempt to write a readonly database".
    command: >-
      sh -c "mkdir -p /app/db
      && chown -R 1000:1000 /app/db
      && touch /app/db/secweb.db
      && chown 1000:1000 /app/db/secweb.db
      && chmod 0664 /app/db/secweb.db
      && sleep infinity"
    volumes:
      - dbdata:/app/db
  networks:
      - app-network
    restart: unless-stopped
    # Healthy == the DB file exists AND is owned by UID 1000 (the API's user).
    # The api service depends on this, so it never starts against a root-owned
    # volume. (alpine's busybox stat has no --printf; parse human output.)
    healthcheck:
      test: ["CMD", "sh", "-c", "[ -f /app/db/secweb.db ] && stat -c '%u' /app/db/secweb.db 2>/dev/null | grep -qx 1000"]
      interval: 1s
      timeout: 3s
      retries: 30
      start_period: 2s

  cache:
    image: redis:7-alpine
    # IMMUTABLE directive #5: ephemeral, no disk persistence.
    command: ["redis-server", "--appendonly", "no", "--save", ""]
    ports:
      - "6379:6379"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - app-network
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: "1.0"

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    image: secweb/web:latest
    ports:
      - "4173:4173"
    environment:
      STATIC_ROOT: /app/dist
      PORT: 4173
    restart: unless-stopped
    depends_on:
      - api
    networks:
      - app-network
      
volumes:
  dbdata:
  storage:
