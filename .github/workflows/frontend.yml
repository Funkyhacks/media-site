name: secweb-frontend

on:
  push:
    branches: [main, 'lane/frontend']
  pull_request:
    branches: [main, 'lane/frontend']

concurrency:
  group: ci-frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: frontend (vitest + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install deps
        run: npm install
      - name: Type-check
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Run vitest
        run: npm test
